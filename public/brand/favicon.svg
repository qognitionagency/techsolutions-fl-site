<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Favicon, v3.1. Ink tile (#0E0F11, radius 22) like the client's IG avatar, so it holds on light
    and dark browser chrome. Small-size cut of logo-mark.svg at scale 0.74:
    - window dropped (it would be a 2px smudge at 32px);
    - letters stroke 9 (not 8), walls 6 (not 5.5);
    - Wi-Fi reduced to 2 arcs, r 7 / 16, stroke 5, gap 4, so they stay separate at 32px.
  -->
  <defs>
    <linearGradient id="tsf-chrome-roof" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="67">
      <stop offset="0" stop-color="#F4F5F6"/>
      <stop offset="1" stop-color="#A9AEB5"/>
    </linearGradient>
    <linearGradient id="tsf-chrome-body" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="104">
      <stop offset="0" stop-color="#F4F5F6"/>
      <stop offset="1" stop-color="#A9AEB5"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0E0F11"/>
  <g transform="translate(5.6 6.04) scale(0.74)">
    <path d="M60 16L114 58V66.9L60 24.9Z" fill="url(#tsf-chrome-roof)"/>
    <g fill="none" stroke="url(#tsf-chrome-body)" stroke-linejoin="miter">
      <path d="M103 70V101H96" stroke-width="6"/>
      <path d="M90 68H75A7 7 0 0 0 68 75V77A7 7 0 0 0 75 84H83A7 7 0 0 1 90 91V93A7 7 0 0 1 83 100H68" stroke-width="9" stroke-linecap="square"/>
    </g>
    <path d="M6 58L60 16V24.9L6 66.9Z" fill="#E1251B"/>
    <g fill="none" stroke="#E1251B" stroke-linejoin="miter">
      <path d="M17 70V101H24" stroke-width="6"/>
      <path d="M26 68H56M41 68V104.5" stroke-width="9"/>
      <path d="M84 25A7 7 0 0 1 91 32M84 16A16 16 0 0 1 100 32" stroke-width="5"/>
    </g>
  </g>
</svg>
