<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="tsm-title">
  <title id="tsm-title">TechSolutions</title>
  <!--
    TechSolutions mark, v3.1. Redrawn from the client's Instagram avatar (@tech_solutionsfl),
    refined, not reinvented. FOR WHITE / LIGHT BACKGROUNDS.

    Construction (120-unit grid, content box x 6-114, y 12.2-104):
    - Roof: two filled ribbons meeting on the centreline x=60. Outer apex (60,16), eaves (6,58)/(114,58).
      Slope 42:54 (37.9 deg). Ribbon 7 thick perpendicular = 8.9 vertical. Left half red, right half chrome.
    - Walls: corner brackets, stroke 5.5, from y=70 (a gap under the roof) to the baseline y=104,
      with a 7.25 inward foot. Left red, right chrome.
    - T (red) and S (chrome): cap 40 (y 64-104), stroke 8. T bar x 26-56, stem centred x 41.
      S x 64-94, corner radius 7 on the centreline, square terminals.
    - Wi-Fi: three red quarter-arcs centred at (84,32), just above the right roof slope.
      r 6 / 12 / 18, stroke 3.6.
    - Window: 4 panes of 5 x 5 with 2 mullions, centred under the apex (x 54-66, y 34-46).
    Colour: red #E1251B (--color-red-500). Chrome = vertical gradient #E4E6E9 -> #9BA1A8 plus a 0.6
    bevel edge (lighter top-left #8A9097, darker bottom-right #50555C) so it holds on white.
    Clear space: 12 units on every side of the content box.
  -->
  <defs>
    <linearGradient id="tsm-chrome-roof" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="67">
      <stop offset="0" stop-color="#E4E6E9"/>
      <stop offset="1" stop-color="#9BA1A8"/>
    </linearGradient>
    <linearGradient id="tsm-chrome-body" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="104">
      <stop offset="0" stop-color="#E4E6E9"/>
      <stop offset="1" stop-color="#9BA1A8"/>
    </linearGradient>
    <g id="tsm-silver" stroke-linejoin="miter">
      <path d="M60 16L114 58V66.9L60 24.9Z" stroke="none"/>
      <path d="M103.25 70V101.25H96" fill="none" stroke-width="5.5"/>
      <path d="M90 68H75A7 7 0 0 0 68 75V77A7 7 0 0 0 75 84H83A7 7 0 0 1 90 91V93A7 7 0 0 1 83 100H68" fill="none" stroke-width="8" stroke-linecap="square"/>
    </g>
  </defs>

  <!-- Chrome bevel edge -->
  <use href="#tsm-silver" xlink:href="#tsm-silver" x="-0.6" y="-0.6" fill="#8A9097" stroke="#8A9097"/>
  <use href="#tsm-silver" xlink:href="#tsm-silver" x="0.6" y="-0.6" fill="#6E747B" stroke="#6E747B"/>
  <use href="#tsm-silver" xlink:href="#tsm-silver" x="-0.6" y="0.6" fill="#6E747B" stroke="#6E747B"/>
  <use href="#tsm-silver" xlink:href="#tsm-silver" x="0.6" y="0.6" fill="#50555C" stroke="#50555C"/>

  <!-- Chrome face -->
  <path d="M60 16L114 58V66.9L60 24.9Z" fill="url(#tsm-chrome-roof)"/>
  <g fill="none" stroke="url(#tsm-chrome-body)" stroke-linejoin="miter">
    <path d="M103.25 70V101.25H96" stroke-width="5.5"/>
    <path d="M90 68H75A7 7 0 0 0 68 75V77A7 7 0 0 0 75 84H83A7 7 0 0 1 90 91V93A7 7 0 0 1 83 100H68" stroke-width="8" stroke-linecap="square"/>
  </g>

  <!-- Red -->
  <path d="M6 58L60 16V24.9L6 66.9Z" fill="#E1251B"/>
  <g fill="none" stroke="#E1251B" stroke-linejoin="miter">
    <path d="M16.75 70V101.25H24" stroke-width="5.5"/>
    <path d="M26 68H56M41 68V104" stroke-width="8"/>
    <path d="M84 26A6 6 0 0 1 90 32M84 20A12 12 0 0 1 96 32M84 14A18 18 0 0 1 102 32" stroke-width="3.6"/>
  </g>

  <!-- Window -->
  <g fill="#7D838A">
    <rect x="54" y="34" width="5" height="5"/>
    <rect x="61" y="34" width="5" height="5"/>
    <rect x="54" y="41" width="5" height="5"/>
    <rect x="61" y="41" width="5" height="5"/>
  </g>
</svg>
