<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="tsf-mark-title">
  <title id="tsf-mark-title">TechSolutions FL</title>
  <!--
    Construction (100-unit grid):
    - Bracket: rounded square, centreline 8-92, radius 20, stroke 6. Open across the
      top-right corner (top run ends x=56, right run ends y=44; symmetric about the diagonal)
      so the signal leaves the frame.
    - T and S: cap 40 (y 40-80), stroke 8, centred with 8 units clear of the bracket each side.
      S bowls: upper r 7.75, lower r 8.25 (upper bowl smaller for optical balance).
    - Wi-Fi: two 90-degree arcs centred on the S top bar (67,44), r 13 and r 22, stroke 6,
      3-unit gaps. The S itself is the signal source (the "dot").
    Signal-blue = bracket + signal. Slate = letters.
  -->
  <g fill="none" stroke="#1A6BFF" stroke-width="6">
    <path d="M56 8H28A20 20 0 0 0 8 28V72A20 20 0 0 0 28 92H72A20 20 0 0 0 92 72V44"/>
    <path d="M57.808 34.808A13 13 0 0 1 76.192 34.808"/>
    <path d="M51.444 28.444A22 22 0 0 1 82.556 28.444"/>
  </g>
  <g fill="none" stroke="#1E2A3B" stroke-width="8">
    <path d="M19 44H47M33 44V80"/>
    <path d="M81 44H64.75A7.75 7.75 0 0 0 57 51.75A7.75 7.75 0 0 0 64.75 59.5H68.75A8.25 8.25 0 0 1 77 67.75A8.25 8.25 0 0 1 68.75 76H53"/>
  </g>
</svg>
