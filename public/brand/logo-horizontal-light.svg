<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 438 58" width="438" height="58" role="img" aria-labelledby="tshl-title">
  <title id="tshl-title">TechSolutions</title>
  <!--
    Horizontal lockup, v3.1, FOR DARK BACKGROUNDS (footer on --color-slate / ink #0E0F11).
    Same geometry as logo-horizontal.svg. On black the chrome needs no bevel edge (it is how the
    original IG logo is shown): chrome gradient #F4F5F6 -> #A9AEB5, window panes #D5D8DC, red #E1251B.
    Do not place on photography or on red.
  -->
  <defs>
    <linearGradient id="tshl-chrome-roof" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="67">
      <stop offset="0" stop-color="#F4F5F6"/>
      <stop offset="1" stop-color="#A9AEB5"/>
    </linearGradient>
    <linearGradient id="tshl-chrome-body" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="104">
      <stop offset="0" stop-color="#F4F5F6"/>
      <stop offset="1" stop-color="#A9AEB5"/>
    </linearGradient>
    <linearGradient id="tshl-chrome-word" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="20">
      <stop offset="0" stop-color="#F4F5F6"/>
      <stop offset="1" stop-color="#A9AEB5"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(-2.6 -5.8) scale(0.6)">
    <path d="M60 16L114 58V66.9L60 24.9Z" fill="url(#tshl-chrome-roof)"/>
    <g fill="none" stroke="url(#tshl-chrome-body)" stroke-linejoin="miter">
      <path d="M103.25 70V101.25H96" stroke-width="5.5"/>
      <path d="M90 68H75A7 7 0 0 0 68 75V77A7 7 0 0 0 75 84H83A7 7 0 0 1 90 91V93A7 7 0 0 1 83 100H68" stroke-width="8" stroke-linecap="square"/>
    </g>
    <path d="M6 58L60 16V24.9L6 66.9Z" fill="#E1251B"/>
    <g fill="none" stroke="#E1251B" stroke-linejoin="miter">
      <path d="M16.75 70V101.25H24" stroke-width="5.5"/>
      <path d="M26 68H56M41 68V104" stroke-width="8"/>
      <path d="M84 26A6 6 0 0 1 90 32M84 20A12 12 0 0 1 96 32M84 14A18 18 0 0 1 102 32" stroke-width="3.6"/>
    </g>
    <g fill="#D5D8DC">
      <rect x="54" y="34" width="5" height="5"/>
      <rect x="61" y="34" width="5" height="5"/>
      <rect x="54" y="41" width="5" height="5"/>
      <rect x="61" y="41" width="5" height="5"/>
    </g>
  </g>

  <!-- Wordmark -->
