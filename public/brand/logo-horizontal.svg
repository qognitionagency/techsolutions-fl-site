<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 438 58" width="438" height="58" role="img" aria-labelledby="tsh-title">
  <title id="tsh-title">TechSolutions</title>
  <!--
    Horizontal lockup, v3.1, FOR WHITE / LIGHT BACKGROUNDS (nav). Dark backgrounds: logo-horizontal-light.svg.
    Box stays 438 x 58 because Nav/Footer <img> carry width="438" height="58".
    - Mark (logo-mark.svg geometry) at scale 0.6: x 1-65.8, y 1.5-56.6.
    - Wordmark "TECH" red + "SOLUTIONS" chrome, drawn paths (no font dependency).
      Letter grid: cap 20, stroke 4.6, corner radius 4 (S 3.85), extended widths (T/C/H/U/N/S 20, O 22,
      E 17, L 16), spacing 3.4 with optical kerns (T-E, C-H, L-U, U-T, T-I). Italic = skewX(-12).
      Placed at scale 1.27 (cap 25.4), x 78-434.6, y 16.8-42.2, optically centred on the mark.
    - The tagline is NOT in this lockup: at nav height (22-28px) it would render under 4px.
      The full lockup with tagline is logo-stacked.svg.
    Clear space: 12 units (half the cap height) on every side. Minimum size: 22px tall.
  -->
  <defs>
    <linearGradient id="tsh-chrome-roof" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="67">
      <stop offset="0" stop-color="#E4E6E9"/>
      <stop offset="1" stop-color="#9BA1A8"/>
    </linearGradient>
    <linearGradient id="tsh-chrome-body" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="104">
      <stop offset="0" stop-color="#E4E6E9"/>
      <stop offset="1" stop-color="#9BA1A8"/>
    </linearGradient>
    <linearGradient id="tsh-chrome-word" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="20">
      <stop offset="0" stop-color="#E4E6E9"/>
      <stop offset="1" stop-color="#9BA1A8"/>
    </linearGradient>
    <g id="tsh-silver-mark" stroke-linejoin="miter">
      <path d="M60 16L114 58V66.9L60 24.9Z" stroke="none"/>
      <path d="M103.25 70V101.25H96" fill="none" stroke-width="5.5"/>
      <path d="M90 68H75A7 7 0 0 0 68 75V77A7 7 0 0 0 75 84H83A7 7 0 0 1 90 91V93A7 7 0 0 1 83 100H68" fill="none" stroke-width="8" stroke-linecap="square"/>
    </g>
    <g id="tsh-silver-word" stroke-width="4.6" stroke-linejoin="miter">
      <g fill="none">
        <path d="M108.6 2.3H94.75A3.85 3.85 0 0 0 90.9 6.15A3.85 3.85 0 0 0 94.75 10H102.45A3.85 3.85 0 0 1 106.3 13.85A3.85 3.85 0 0 1 102.45 17.7H88.6"/>
        <path d="M118.3 2.3H127.7A4 4 0 0 1 131.7 6.3V13.7A4 4 0 0 1 127.7 17.7H118.3A4 4 0 0 1 114.3 13.7V6.3A4 4 0 0 1 118.3 2.3Z"/>
        <path d="M139.7 0V17.7H153.4"/>
        <path d="M157.6 0V13.7A4 4 0 0 0 161.6 17.7H169A4 4 0 0 0 173 13.7V0"/>
        <path d="M177.5 2.3H197.5M187.5 2.3V20"/>
        <path d="M202 0V20"/>
        <path d="M214 2.3H223.4A4 4 0 0 1 227.4 6.3V13.7A4 4 0 0 1 223.4 17.7H214A4 4 0 0 1 210 13.7V6.3A4 4 0 0 1 214 2.3Z"/>
        <path d="M276.5 2.3H262.65A3.85 3.85 0 0 0 258.8 6.15A3.85 3.85 0 0 0 262.65 10H270.35A3.85 3.85 0 0 1 274.2 13.85A3.85 3.85 0 0 1 270.35 17.7H256.5"/>
      </g>
      <path d="M233.1 20V0H238.3L248.5 13.6V0H253.1V20H247.9L237.7 6.4V20Z" stroke="none"/>
    </g>
  </defs>

  <!-- Mark -->
  <g transform="translate(-2.6 -5.8) scale(0.6)">
    <use href="#tsh-silver-mark" xlink:href="#tsh-silver-mark" x="-0.6" y="-0.6" fill="#8A9097" stroke="#8A9097"/>
    <use href="#tsh-silver-mark" xlink:href="#tsh-silver-mark" x="0.6" y="-0.6" fill="#6E747B" stroke="#6E747B"/>
    <use href="#tsh-silver-mark" xlink:href="#tsh-silver-mark" x="-0.6" y="0.6" fill="#6E747B" stroke="#6E747B"/>
    <use href="#tsh-silver-mark" xlink:href="#tsh-silver-mark" x="0.6" y="0.6" fill="#50555C" stroke="#50555C"/>
    <path d="M60 16L114 58V66.9L60 24.9Z" fill="url(#tsh-chrome-roof)"/>
    <g fill="none" stroke="url(#tsh-chrome-body)" stroke-linejoin="miter">
      <path d="M103.25 70V101.25H96" stroke-width="5.5"/>
      <path d="M90 68H75A7 7 0 0 0 68 75V77A7 7 0 0 0 75 84H83A7 7 0 0 1 90 91V93A7 7 0 0 1 83 100H68" stroke-width="8" stroke-linecap="square"/>
    </g>
    <path d="M6 58L60 16V24.9L6 66.9Z" fill="#E1251B"/>
    <g fill="none" stroke="#E1251B" stroke-linejoin="miter">
      <path d="M16.75 70V101.25H24" stroke-width="5.5"/>
      <path d="M26 68H56M41 68V104" stroke-width="8"/>
      <path d="M84 26A6 6 0 0 1 90 32M84 20A12 12 0 0 1 96 32M84 14A18 18 0 0 1 102 32" stroke-width="3.6"/>
    </g>
    <g fill="#7D838A">
      <rect x="54" y="34" width="5" height="5"/>
      <rect x="61" y="34" width="5" height="5"/>
      <rect x="54" y="41" width="5" height="5"/>
      <rect x="61" y="41" width="5" height="5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(78 16.8) scale(1.27) translate(4.25 0) skewX(-12)">
    <g fill="none" stroke="#E1251B" stroke-width="4.6" stroke-linejoin="miter">
      <path d="M0 2.3H20M10 2.3V20"/>
      <path d="M39.2 2.3H24.5V17.7H39.2M24.5 10H37.7"/>
      <path d="M62.6 2.3H48.9A4 4 0 0 0 44.9 6.3V13.7A4 4 0 0 0 48.9 17.7H62.6"/>
      <path d="M67.5 0V20M82.9 0V20M67.5 10H82.9"/>
    </g>
    <use href="#tsh-silver-word" xlink:href="#tsh-silver-word" x="-0.45" y="-0.45" fill="#8A9097" stroke="#8A9097"/>
    <use href="#tsh-silver-word" xlink:href="#tsh-silver-word" x="0.45" y="-0.45" fill="#6E747B" stroke="#6E747B"/>
    <use href="#tsh-silver-word" xlink:href="#tsh-silver-word" x="-0.45" y="0.45" fill="#6E747B" stroke="#6E747B"/>
    <use href="#tsh-silver-word" xlink:href="#tsh-silver-word" x="0.45" y="0.45" fill="#50555C" stroke="#50555C"/>
    <use href="#tsh-silver-word" xlink:href="#tsh-silver-word" fill="url(#tsh-chrome-word)" stroke="url(#tsh-chrome-word)"/>
  </g>
</svg>
