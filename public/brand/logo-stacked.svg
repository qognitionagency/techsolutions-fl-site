<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="tss-title">
  <title id="tss-title">TechSolutions, smart home installations</title>
  <!--
    Full (stacked) lockup, v3.1, FOR WHITE BACKGROUNDS. Faithful to the IG avatar: mark over
    wordmark, tagline tracked between thin red rules. Square box so logo-512.png needs no crop.
    - Mark at scale 1.9: x 57.4-262.6, y 47.5-221.9.
    - Wordmark at scale 0.84 (cap 16.8): x 42.1-277.9, y 237.9-254.7. 16 units under the mark.
    - Tagline "SMART HOME INSTALLATIONS": monoline caps, cap 5.6, stroke 0.9, tracking ~0.28em,
      x 97.45-222.55, y 266.7-272.3. Red rules 0.9 thick at y 269.5, 6 units clear of the type,
      outer ends flush with the wordmark baseline extents.
    Use this lockup at 160px wide or more. Below that, use logo-horizontal.svg.
  -->
  <defs>
    <linearGradient id="tss-chrome-roof" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="67">
      <stop offset="0" stop-color="#E4E6E9"/>
      <stop offset="1" stop-color="#9BA1A8"/>
    </linearGradient>
    <linearGradient id="tss-chrome-body" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="104">
      <stop offset="0" stop-color="#E4E6E9"/>
      <stop offset="1" stop-color="#9BA1A8"/>
    </linearGradient>
    <linearGradient id="tss-chrome-word" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="20">
      <stop offset="0" stop-color="#E4E6E9"/>
      <stop offset="1" stop-color="#9BA1A8"/>
    </linearGradient>
    <g id="tss-silver-mark" stroke-linejoin="miter">
      <path d="M60 16L114 58V66.9L60 24.9Z" stroke="none"/>
      <path d="M103.25 70V101.25H96" fill="none" stroke-width="5.5"/>
      <path d="M90 68H75A7 7 0 0 0 68 75V77A7 7 0 0 0 75 84H83A7 7 0 0 1 90 91V93A7 7 0 0 1 83 100H68" fill="none" stroke-width="8" stroke-linecap="square"/>
    </g>
    <g id="tss-silver-word" stroke-width="4.6" stroke-linejoin="miter">
